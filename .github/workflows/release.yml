name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Run CI Suite
        run: |
          go vet ./...
          go test -race ./...
          pnpm install
          pnpm audit --prod
          pnpm -r build
          pnpm -r test
          go run ./cmd/openpassport verify templates/open-passport-template

      - name: Build Cross-Platform Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.Version=${TAG}"

          # Linux
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/openpassport-linux-amd64 ./cmd/openpassport
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/openpassport-linux-arm64 ./cmd/openpassport

          # macOS
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/openpassport-darwin-amd64 ./cmd/openpassport
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/openpassport-darwin-arm64 ./cmd/openpassport

          # Windows
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/openpassport-windows-amd64.exe ./cmd/openpassport
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/openpassport-windows-arm64.exe ./cmd/openpassport

          # SHA256SUMS
          cd dist
          sha256sum * > SHA256SUMS
          cd ..

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
