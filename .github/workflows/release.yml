name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/openpassport-windows-amd64.exe ./cmd/openpassport
          GOOS=linux GOARCH=amd64 go build -o dist/openpassport-linux-amd64 ./cmd/openpassport
          GOOS=darwin GOARCH=arm64 go build -o dist/openpassport-darwin-arm64 ./cmd/openpassport
          GOOS=darwin GOARCH=amd64 go build -o dist/openpassport-darwin-amd64 ./cmd/openpassport

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
